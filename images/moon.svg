<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="moonGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </radialGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glow -->
  <circle cx="256" cy="256" r="215" fill="#E2E8F0" opacity="0.15" filter="url(#moonGlow)"/>
  <!-- Moon Body -->
  <circle cx="256" cy="256" r="200" fill="url(#moonGrad)"/>
  <!-- Craters -->
  <circle cx="190" cy="180" r="32" fill="#64748B" opacity="0.35"/>
  <circle cx="185" cy="175" r="28" fill="#475569" opacity="0.3"/>
  <circle cx="310" cy="220" r="44" fill="#64748B" opacity="0.35"/>
  <circle cx="305" cy="215" r="38" fill="#475569" opacity="0.3"/>
  <circle cx="230" cy="320" r="50" fill="#64748B" opacity="0.35"/>
  <circle cx="225" cy="315" r="44" fill="#475569" opacity="0.3"/>
  <circle cx="340" cy="340" r="24" fill="#64748B" opacity="0.3"/>
  <circle cx="150" cy="280" r="20" fill="#64748B" opacity="0.25"/>
  <circle cx="270" cy="140" r="18" fill="#64748B" opacity="0.25"/>
</svg>
